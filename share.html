<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Note | NoteFlow AI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="index.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            background-attachment: fixed;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        [data-theme="light"] body {
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,95%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,90%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,90%,1) 0, transparent 50%);
        }
        .share-card {
            width: 100%;
            max-width: 800px;
            padding: 3rem;
            margin-top: 2rem;
        }
        .share-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }
        .share-content {
            font-size: 1.125rem;
            white-space: pre-wrap;
            margin-bottom: 3rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div id="share-root"></div>

    <script src="db.js"></script>
    <script>
        const renderShare = async () => {
            const root = document.getElementById('share-root');
            root.innerHTML = `<div style="text-align:center; padding: 5rem;"><i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i></div>`;
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                root.innerHTML = `
                    <div class="card" style="text-align: center; padding: 5rem;">
                        <h1>Invalid Link</h1>
                        <p style="color: var(--text-muted); margin-top: 1rem;">This share link is invalid or has been revoked.</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 2rem;">Go to Home</a>
                    </div>
                `;
                return;
            }

            try {
                const note = await DB.getNoteByShareToken(token);
                
                // Sync theme with user preference if logged in, else default dark
                const theme = localStorage.getItem('nf_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);

                root.innerHTML = `
                    <div class="card share-card fade-in">
                        <div class="share-header">
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
                                <img src="noteflow_logo.png" style="width: 24px; height: 24px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5968/5968263.png'">
                                <span class="logo-text" style="font-size: 1rem;">NoteFlow AI</span>
                            </div>
                            <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 1rem;">${note.title || 'Untitled'}</h1>
                            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;">
                                ${note.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                            </div>
                            <div style="font-size: 0.875rem; color: var(--text-muted);">
                                <i class="far fa-calendar"></i> Shared on ${new Date(note.updatedAt).toLocaleDateString()}
                            </div>
                        </div>

                        <div class="share-content">${note.content}</div>

                        ${note.aiSummary ? `
                            <div class="ai-panel" style="padding: 2rem; border-radius: var(--radius); margin-bottom: 2rem;">
                                <h3 style="margin-bottom: 1rem; color: var(--primary);"><i class="fas fa-robot"></i> AI Summary</h3>
                                <p style="line-height: 1.6;">${note.aiSummary}</p>
                            </div>
                        ` : ''}

                        ${note.aiActionItems && note.aiActionItems.length > 0 ? `
                            <div class="ai-panel" style="padding: 2rem; border-radius: var(--radius);">
                                <h3 style="margin-bottom: 1rem; color: var(--primary);"><i class="fas fa-tasks"></i> Action Items</h3>
                                <ul style="padding-left: 1.5rem; line-height: 1.8;">
                                    ${note.aiActionItems.map(item => `<li>${item}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        <div style="margin-top: 5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 3rem;">
                            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Create your own AI-powered workspace with NoteFlow AI.</p>
                            <a href="index.html" class="btn btn-primary">Start Taking Notes</a>
                        </div>
                    </div>
                `;
            } catch (err) {
                root.innerHTML = `
                    <div class="card" style="text-align: center; padding: 5rem;">
                        <h1>Note Not Found</h1>
                        <p style="color: var(--text-muted); margin-top: 1rem;">This note might be private or no longer exists.</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 2rem;">Go to Home</a>
                    </div>
                `;
            }
        };

        renderShare();
    </script>
</body>
</html>
